<template>
    <lightning-card title="Financial Summary" icon-name="standard:currency">
        <div class="slds-var-p-horizontal_medium">
            <template if:true={hasError}>
                <div class="slds-text-color_error">{errorMessage}</div>
            </template>

            <template if:false={hasError}>
                <div class="slds-grid slds-wrap slds-gutters slds-var-p-bottom_medium">
                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box slds-theme_default kpi-tile">
                            <p class="slds-text-title_caps">Gross Revenue</p>
                            <lightning-formatted-number
                                value={grossRevenue}
                                format-style="currency"
                                currency-code="USD"
                                class="slds-text-heading_medium"
                            ></lightning-formatted-number>
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box slds-theme_default kpi-tile">
                            <p class="slds-text-title_caps">Total Cost</p>
                            <lightning-formatted-number
                                value={totalCost}
                                format-style="currency"
                                currency-code="USD"
                                class="slds-text-heading_medium"
                            ></lightning-formatted-number>
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-3">
                        <div class={netRevenueTileClass}>
                            <p class="slds-text-title_caps">Net Revenue</p>
                            <lightning-formatted-number
                                value={netRevenue}
                                format-style="currency"
                                currency-code="USD"
                                class="slds-text-heading_medium"
                            ></lightning-formatted-number>
                        </div>
                    </div>
                </div>

                <div class="slds-grid slds-wrap slds-gutters slds-var-p-bottom_medium">
                    <div class="slds-col slds-size_1-of-3">
                        <div class={profitMarginTileClass}>
                            <p class="slds-text-title_caps">Profit Margin</p>
                            <lightning-formatted-number
                                value={profitMarginPct}
                                format-style="percent-fixed"
                                maximum-fraction-digits="2"
                                class="slds-text-heading_medium"
                            ></lightning-formatted-number>
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box slds-theme_default kpi-tile">
                            <p class="slds-text-title_caps">Fuel Cost</p>
                            <lightning-formatted-number
                                value={fuelCost}
                                format-style="currency"
                                currency-code="USD"
                                class="slds-text-heading_medium"
                            ></lightning-formatted-number>
                        </div>
                    </div>

                    <div class="slds-col slds-size_1-of-3">
                        <div class="slds-box slds-theme_default kpi-tile">
                            <p class="slds-text-title_caps">Maintenance Allocation</p>
                            <lightning-formatted-number
                                value={maintenanceAllocation}
                                format-style="currency"
                                currency-code="USD"
                                class="slds-text-heading_medium"
                            ></lightning-formatted-number>
                        </div>
                    </div>
                </div>

                <div class="slds-grid slds-grid_vertical-align-center">
                    <span class={deliveryBadgeClass}>{deliveryStatusLabel}</span>
                    <template if:true={showDelayDays}>
                        <span class="slds-var-m-left_small slds-text-body_small">{delayDaysLabel}</span>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
